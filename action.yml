name: 'Codex Security Linter'
description: 'Automated AI-powered security linter & vulnerability auditor for Pull Requests.'
branding:
  icon: 'shield'
  color: 'purple'
inputs:
  github-token:
    description: 'GitHub Token for authentication'
    required: true
  openai-api-key:
    description: 'OpenAI API Key for security analysis'
    required: true
  model:
    description: 'Model to use for auditing'
    required: false
    default: 'gpt-4o-mini'
runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      shell: bash
      run: pip install -r ${{ github.action_path }}/requirements.txt
    - name: Run Security Audit
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        MODEL_NAME: ${{ inputs.model }}
        GITHUB_EVENT_PATH: ${{ github.event_path }}
      run: python ${{ github.action_path }}/scanner.py
