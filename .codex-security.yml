# PR Security Linter Configuration (Backward compatibility alias for .pr-security.yml)
version: 1.0

settings:
  model: "gpt-4o-mini"
  severity_threshold: "HIGH"

ignore_paths:
  - "tests/*"
  - "docs/*"
  - "*.lock"
  - "dist/*"
  - "build/*"

rules:
  secret_leak_detection: true
  malware_and_webshells: true
  injection_flaws: true
  deserialization_risks: true
  memory_safety_checks: true
